[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floway"
version = "0.1.0"
description = "A lightweight flow cytometry analysis toolkit: FCS parsing, debris/singlet gating, and plotting."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Wei Chen" }
]
keywords = ["flow cytometry", "fcs", "gating", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = ["build", "twine"]
auto = ["scikit-learn>=0.24"]

[project.urls]
Homepage = "https://github.com/chenomics/floway"
Issues = "https://github.com/chenomics/floway/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
floway = ["py.typed"]
